<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Will you be my Valentine?</title>

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffe6ee;
      --bg2: #fff1f6;
      --card: #ffffff;
      --yes: #ff3b7a;
      --yesHover: #ff5c91;
      --no: #6b7280;
      --text: #111827;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh; /* FIX: safe viewport height */
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
    }

    .card {
      background: var(--card);
      width: 100%;
      max-width: 520px;
      border-radius: 28px;
      padding: 32px 28px 36px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,.12);
    }

    /* HEART */
    .heart {
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2rem);
      margin-bottom: 20px;
      font-weight: 800;
    }

    .buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 14px 26px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }

    .yes {
      background: var(--yes);
      color: white;
    }

    .yes:hover {
      background: var(--yesHover);
      transform: scale(1.05);
    }

    .no {
      background: #e5e7eb;
      color: var(--no);
    }

    .no:hover {
      transform: translateY(-2px);
    }

    .message {
      margin-top: 22px;
      font-size: 1.25rem;
      font-weight: 700;
      display: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <!-- CLEAN HEART SVG -->
    <svg class="heart" viewBox="0 0 24 24" fill="#ff3b7a">
      <path d="M12 21s-6.7-4.4-9.3-8C-1 7.6 2.4 3 6.7 4.3 8.7 5 10 7 12 9c2-2 3.3-4 5.3-4.7C21.6 3 25 7.6 21.3 13 18.7 16.6 12 21 12 21z"/>
    </svg>

    <h1 id="question">
      Samricho, yene arat ayn — will you be my Valentine?
    </h1>

    <div class="buttons" id="buttons">
      <button class="yes" onclick="yes()">Yes</button>
      <button class="no" onclick="no()">No</button>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script>
    let noCount = 0;
    const noLines = [
      "Are you sure?",
      "Anche....",
      "Last chance.",
      "Stop playin lady 😌",
      "STOP IT NOW DINGAY RAS.",
      "You’re testing fate now."
    ];

    function no() {
      noCount++;
      document.querySelector(".no").textContent =
        noLines[Math.min(noCount, noLines.length - 1)];
    }

    function yes() {
      document.getElementById("buttons").style.display = "none";
      const msg = document.getElementById("message");
      msg.style.display = "block";
      msg.innerHTML = "Good job baby — you made the right choice! ❤️";

      confetti({
        particleCount: 140,
        spread: 80,
        origin: { y: 0.6 }
      });
    }
  </script>
</body>
</html>
